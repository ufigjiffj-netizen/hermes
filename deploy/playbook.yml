---
- name: Deploy Hermes FunPay Bot
  hosts: all
  become: yes
  vars:
    app_user: hermes
    app_dir: /opt/hermes
    repo_url: https://github.com/ufigjiffj-netizen/hermes.git
    branch: main
    funpay_golden_key: ""  # Set this in inventory or via --extra-vars

  tasks:
    - name: Ensure app user exists
      user:
        name: "{{ app_user }}"
        system: yes
        create_home: yes

    - name: Install system dependencies (Debian/Ubuntu)
      apt:
        name:
          - git
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: Clone Hermes repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: yes
      become_user: "{{ app_user }}"
      notify: Restart Hermes

    - name: Create Python virtual environment
      command: python3 -m venv {{ app_dir }}/venv
      args:
        creates: "{{ app_dir }}/venv/bin/python"
      become_user: "{{ app_user }}"

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      become_user: "{{ app_user }}"
      notify: Restart Hermes

    - name: Create data directory for SQLite
      file:
        path: "{{ app_dir }}/data"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Template configuration file
      template:
        src: templates/config.yaml.j2
        dest: "{{ app_dir }}/config.yaml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'
      notify: Restart Hermes

    - name: Template systemd service
      template:
        src: templates/hermes.service.j2
        dest: /etc/systemd/system/hermes.service
      notify:
        - Reload systemd
        - Restart Hermes

    - name: Enable and start Hermes service
      systemd:
        name: hermes
        enabled: yes
        state: started

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Hermes
      systemd:
        name: hermes
        state: restarted
